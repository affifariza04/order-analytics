[project]
name = "order-analytics"
version = "0.1.0"
description = "Analytics engineering on DuckDB + dbt: messy event data in, tested and contracted marts out."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
  "duckdb>=1.1",
]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
